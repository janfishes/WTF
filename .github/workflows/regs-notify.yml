# Emails Jan when a fishing regulation changes. Two channels, on purpose:
# a GitHub issue (no credentials, doubles as the audit trail) and a direct
# email through Resend to jan@aceshardware.com (independent of every GitHub
# notification setting). Either one arriving is enough.
#
# Fires on any push to main that touches regs.json -- whether the weekly FWC
# check made it or a person did -- and opens a GitHub issue. GitHub then mails
# the repo owner, which is the notification: no SMTP server, no API key, no
# secret stored in a public repo. The issue is the audit trail as well; close it
# once you have read it.
#
# The issue is ASSIGNED to janfishes and @mentions him in the body. That is
# deliberate: a plain new issue only emails people WATCHING the repo, and Jan is
# not watching his own repo (checked 2026-08-01 -- the subscription endpoint
# 404s). An assignment or a mention lands in GitHub's "Participating" category
# instead, which is emailed by default and does not care about watch state.
# Do not remove the assignee or the mention to tidy this up; they ARE the wiring.
#
# If mail ever stops arriving, check github.com/settings/notifications --
# Participating must have Email ticked -- before suspecting this file.
name: Notify on regulation change

on:
  push:
    branches: [main]
    paths: ['regs.json']
  workflow_dispatch:        # so the path can be tested without faking a reg change

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Since Build 357 the weekly check pushes regs.json EVERY run to bump the
      # `verified` date (the Season Guide's "(Last verified)" stamp). That bump is
      # not a regulation change, so only notify when `updated` moved. A manual
      # workflow_dispatch always notifies, so the path stays testable.
      - name: Did a limit actually move?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          old=$(git show HEAD~1:regs.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('updated',''))" 2>/dev/null || echo "")
          new=$(python3 -c "import json;print(json.load(open('regs.json')).get('updated',''))")
          echo "old=$old new=$new"
          if [ "$old" = "$new" ]; then
            echo "verified-only bump — no notification."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read what changed
        if: steps.gate.outputs.moved == 'true'
        id: diff
        run: |
          # The newest dated section of the changelog is the human summary of
          # this push; the raw diff of regs.json is the receipt underneath it.
          {
            echo 'body<<REGS_EOF'
            echo "@janfishes — FWC regulation data changed in the WTF Log app."
            echo ""
            echo "**Updated:** $(python3 -c "import json;print(json.load(open('regs.json'))['updated'])")"
            echo ""
            echo "## Latest changelog entry"
            echo ""
            awk '/^## /{n++} n==1{print} n==2{exit}' REGS_CHANGELOG.md
            echo ""
            echo "## regs.json diff"
            echo ""
            echo '```diff'
            git diff HEAD~1 HEAD -- regs.json | head -200
            echo '```'
            echo ""
            echo "These limits are live in the app now — phones pick them up on the next open."
            echo "Season Guide > REGULATION CHANGES shows the same entry in the app."
            echo ""
            echo "Commit: ${{ github.sha }}"
            echo 'REGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open the notification issue
        if: steps.gate.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.diff.outputs.body }}
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "FWC changes to WTF" \
            --assignee janfishes \
            --body-file /tmp/body.md

      # Direct mail to jan@aceshardware.com, independent of GitHub notification
      # settings. Skipped silently when RESEND_API_KEY is not set, so the repo
      # still works for anyone who clones it without the secret.
      #
      # Resend with no verified domain may only send FROM onboarding@resend.dev
      # and TO the address that owns the Resend account -- which is exactly this
      # one address, so no domain setup is needed. If mail should ever go to a
      # second recipient, that is when a domain has to be verified at
      # resend.com/domains.
      - name: Email Jan
        if: steps.gate.outputs.moved == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BODY: ${{ steps.diff.outputs.body }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY not set — skipping the direct email."
            echo "The GitHub issue above is still the notification."
            exit 0
          fi
          # jq -Rs builds a correctly escaped JSON string out of the body, so a
          # quote or a backslash in a regulation note cannot break the payload.
          jq -n \
            --arg from "WTF Log <onboarding@resend.dev>" \
            --arg to "jan@aceshardware.com" \
            --arg subject "FWC changes to WTF" \
            --arg text "$BODY" \
            '{from:$from, to:[$to], subject:$subject, text:$text}' > /tmp/mail.json
          code=$(curl -sS -o /tmp/mail-response.json -w '%{http_code}' \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/mail.json)
          echo "Resend HTTP $code"
          cat /tmp/mail-response.json
          echo ""
          # Fail loudly: a silent mail failure is the exact thing this job exists
          # to prevent, and a failed run is itself a notification.
          [ "$code" = "200" ] || { echo "Resend rejected the send."; exit 1; }
